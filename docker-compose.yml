# Local stack: `docker compose up --build`, then open http://localhost:3000.
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      # The frontend origin must be allowed or every browser request fails
      # preflight. Comma-separated; parsed by pydantic-settings.
      SCIFORENSICS_API__CORS_ORIGINS: '["http://localhost:3000"]'
      SCIFORENSICS_RUNTIME__LOG_FORMAT: json
    volumes:
      # Persist the fetched weights across container restarts.
      - weights:/home/sci/.cache/sciforensics
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        SCIFORENSICS_API: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  weights:
