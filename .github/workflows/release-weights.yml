name: Publish checkpoint
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example weights-v1)
        required: true
        type: string
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify the existing checkpoint
        run: |
          echo 'befec5b863580ab6dfa1fa3005b37e447f54d79e7d16e90fe3fe5f2dc71a3c6f  models/weights.pth' | sha256sum --check
      - name: Publish the verified release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" models/weights.pth --target "$GITHUB_SHA" --title "SciForensics demo checkpoint" --notes "Inherited demonstration checkpoint. SHA-256 befec5b863580ab6dfa1fa3005b37e447f54d79e7d16e90fe3fe5f2dc71a3c6f. Scores are uncalibrated; see MODEL_CARD.md."
