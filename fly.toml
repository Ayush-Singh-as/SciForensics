# fly.toml app configuration file generated for sciforensics-api on 2026-10-13T12:50:46+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sciforensics-api'
primary_region = 'sin'

[build]
  dockerfile = 'docker/api.Dockerfile'

[env]
  SCIFORENSICS_API__MAX_CONCURRENT_JOBS = '2'
  SCIFORENSICS_IMAGE__MAX_DIMENSION = '1280'
  SCIFORENSICS_RUNTIME__DEVICE = 'cpu'
  SCIFORENSICS_RUNTIME__LOG_FORMAT = 'json'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
