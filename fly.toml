# Supply the globally unique app name with `fly launch --no-deploy` or
# `fly deploy --app <your-app>`. The backend keeps jobs in one process.
primary_region = "bom"

[build]
  dockerfile = "docker/api.Dockerfile"

[env]
  SCIFORENSICS_RUNTIME__DEVICE = "cpu"
  SCIFORENSICS_RUNTIME__LOG_FORMAT = "json"
  SCIFORENSICS_IMAGE__MAX_DIMENSION = "1280"
  SCIFORENSICS_API__MAX_CONCURRENT_JOBS = "2"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
